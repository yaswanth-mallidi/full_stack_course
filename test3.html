<!doctype html>
<html>
    <head>

        <STYLE>
            body
            {  display:grid;
                grid-template-columns: auto auto auto;
              grid-template-areas: 
                      "header header header"
                       "nav article article"
                       "adds a1 a1"
                       "footer footer footer";
                       background-color:black;
 }
          header
            {
                grid-area:header;
                background-color: white;
                position:relative;
                border:10px solid tomato;
            }

            nav
            {
                grid-area:nav;
                background-color: white;
                color:turquoise;
                 border:10px solid tomato;

               
            }
            nav ul {
                display:flex;
                justify-content:space-evenly;
                align-content:center;
            }
          article
          {
              grid-area:article;
              background-color: white;
              color:bisque;
               border:10px solid tomato;
              
          }


            #adds
            {
                grid-area:adds;
                background-color: white;
                color:thistle;
                 border:10px solid tomato;
                
            }
            #a1
            {
                grid-area:a1;
                background-color: white;
                color:tomato;
                border:10px solid tomato;
            }
            footer
            {
                grid-area:footer;
                background-color: white;
                color:violet;
                border:10px solid tomato;
            }
        </STYLE>

    </head>
    <body>
        <header>

                    <li> resources</li>
                    <li>login</li>
                    </ul>
        </nav>

           <p> THE WORLD IS NICE the hello world </p>

    </body>
</html>
